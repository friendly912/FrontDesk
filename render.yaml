services:
  - type: web
    name: frontdesk-mvp
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: BOOKINGS_BACKEND
        value: csv
      - key: LOCAL_DATA_DIR
        value: ./data
      - key: GOOGLE_SERVICE_ACCOUNT_FILE
        value: /etc/secrets/service-account.json
      - key: SHOPS_DIR
        value: ./shops
      - key: VALIDATE_LINE_SIGNATURE
        value: "true"
      - key: DEBUG_TOKEN
        sync: false
