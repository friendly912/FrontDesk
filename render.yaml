services:
  - type: web
    name: frontdesk-mvp
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_FILE
        value: /etc/secrets/service-account.json
      - key: SHOPS_DIR
        value: ./shops
      - key: VALIDATE_TWILIO_SIGNATURE
        value: "true"
      - key: PUBLIC_BASE_URL
        value: https://frontdesk-mvp.onrender.com
